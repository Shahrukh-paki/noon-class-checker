name: Class Connection checker

# Started on time by Supabase (pg_cron -> GitHub API, see supabase/dispatch_schedule.sql):
#   check runs Mon-Sat 07:35-13:15 and 13:15-18:20 PKT, keep-alive every 2 hours every day.
# GitHub's own timer below is only a backup keep-alive: GitHub often starts scheduled runs
# hours late, which is harmless for a keep-alive but useless for checking lectures.
on:
  schedule:
    - cron: "20 15 * * *"
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read live classes, keepalive = only renew the Noon sign-in"
        required: false
        default: "check"
      run_until_pkt:
        description: "Stop time in Pakistan time, e.g. 13:15 (check runs only)"
        required: false
        default: ""
      max_minutes:
        description: "Longest run in minutes (check runs only)"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: class-connection-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: node checker.mjs --selftest

      - name: Check live classes
        run: node checker.mjs
        env:
          CHECKER_FUNCTION_URL: ${{ secrets.CHECKER_FUNCTION_URL }}
          CLASS_MONITOR_TOKEN: ${{ secrets.CLASS_MONITOR_TOKEN }}
          NOON_SESSION: ${{ secrets.NOON_SESSION }}
          CHECK_SECONDS: "60"
          MODE: ${{ github.event_name == 'schedule' && 'keepalive' || inputs.mode }}
          RUN_UNTIL_PKT: ${{ github.event_name == 'workflow_dispatch' && inputs.run_until_pkt || '' }}
          MAX_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_minutes || '20' }}
